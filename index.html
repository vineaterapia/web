<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vine a Terapia — Biblioteca y Comunidad Clínica</title>
<style>
  :root{--lilac:#6D4CBB;--lilac-dark:#56389E;--lilac-soft:#EDE6FA;--paper:#F7F4FC;--ink:#2A2142;--muted:#6D6187;--line:#E6DDF5;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  .card{max-width:560px;width:100%;background:#fff;border:1px solid var(--line);border-radius:24px;padding:44px 32px;box-shadow:0 16px 44px rgba(72,48,125,.08)}
  .logo{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#7C5AC8,#5D3EA8);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 10px 24px rgba(109,76,187,.28)}
  .logo svg{width:30px;height:30px}
  h1{font-family:var(--serif);font-size:34px;margin-bottom:8px}
  p{color:var(--muted);font-size:15.5px;line-height:1.6;margin-bottom:26px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--lilac);color:#fff;font-weight:700;padding:14px 26px;border-radius:99px;text-decoration:none;transition:.15s;box-shadow:0 8px 20px rgba(109,76,187,.24)}
  .btn:hover{background:var(--lilac-dark);transform:translateY(-1px)}
  .foot{margin-top:24px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h20"/><path d="M13 20V3.5a.5.5 0 0 0-.65-.48l-6 2A.5.5 0 0 0 6 5.5V20"/><circle cx="10" cy="12" r=".75" fill="#fff"/></svg></div>
    <h1>Vine a Terapia</h1>
    <p>Estamos preparando nuestro espacio principal de atención psicológica. Mientras tanto, ya puedes acceder a nuestra Biblioteca con más de 900 recursos clínicos.</p>
    <a class="btn" href="/recursos">Explorar Biblioteca de Recursos →</a>
    <div class="foot">Consultas: vineaterapia@gmail.com</div>
  </div>
</body>
</html>
