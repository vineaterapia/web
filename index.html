<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vine a Terapia — Biblioteca y Comunidad Clínica</title>
<style>
  :root{--lilac:#6D4CBB;--lilac-dark:#56389E;--lilac-soft:#EDE6FA;--paper:#F7F4FC;--ink:#2A2142;--muted:#6D6187;--line:#E6DDF5;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;position:relative;overflow:hidden}
  .bg-orb{position:fixed;border-radius:50%;filter:blur(65px);pointer-events:none;z-index:0;opacity:.65}
  .orb-1{width:380px;height:380px;background:#DFD3F8;top:-110px;left:-90px;animation:floatOrb 11s ease-in-out infinite alternate}
  .orb-2{width:420px;height:420px;background:#E8DCF9;bottom:-140px;right:-100px;animation:floatOrb 14s ease-in-out infinite alternate-reverse}
  @keyframes floatOrb{0%{transform:translate(0,0) scale(1)}100%{transform:translate(36px,26px) scale(1.12)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes haloPulse{0%,100%{box-shadow:0 10px 24px rgba(109,76,187,.26),0 0 0 0 rgba(109,76,187,.22)}50%{box-shadow:0 14px 30px rgba(109,76,187,.34),0 0 0 10px rgba(109,76,187,0)}}
  @keyframes dotBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .card{position:relative;z-index:1;max-width:560px;width:100%;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:26px;padding:44px 32px;box-shadow:0 20px 50px rgba(72,48,125,.09);animation:fadeUp .7s cubic-bezier(.22,1,.36,1) both}
  .logo{width:66px;height:66px;border-radius:19px;background:linear-gradient(135deg,#7C5AC8,#5D3EA8);display:grid;place-items:center;margin:0 auto 18px;cursor:pointer;animation:haloPulse 3.6s ease-in-out infinite;transition:transform .35s cubic-bezier(.22,1,.36,1)}
  .logo svg{width:32px;height:32px;transition:transform .35s cubic-bezier(.22,1,.36,1);transform-origin:left center}
  .logo:hover{transform:translateY(-4px) scale(1.07)}
  .logo:hover svg{transform:perspective(120px) rotateY(-26deg) scale(1.04)}
  .status{display:inline-flex;align-items:center;gap:8px;background:var(--lilac-soft);color:var(--lilac);font-size:12px;font-weight:700;padding:5px 13px;border-radius:99px;margin-bottom:14px}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--lilac);animation:dotBlink 2s ease-in-out infinite}
  h1{font-family:var(--serif);font-size:36px;margin-bottom:10px;letter-spacing:-.3px}
  p{color:var(--muted);font-size:15.5px;line-height:1.65;margin-bottom:28px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--lilac);color:#fff;font-weight:700;padding:15px 28px;border-radius:99px;text-decoration:none;transition:.2s;box-shadow:0 10px 24px rgba(109,76,187,.26)}
  .btn .arr{display:inline-block;transition:transform .2s ease}
  .btn:hover{background:var(--lilac-dark);transform:translateY(-2px);box-shadow:0 14px 28px rgba(109,76,187,.34)}
  .btn:hover .arr{transform:translateX(4px)}
  .foot{margin-top:26px;font-size:12.5px;color:var(--muted)}
  .foot a{color:var(--lilac);font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="card">
    <div class="logo" title="Vine a Terapia"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h20"/><path d="M13 20V3.5a.5.5 0 0 0-.65-.48l-6 2A.5.5 0 0 0 6 5.5V20"/><circle cx="10" cy="12" r=".75" fill="#fff"/></svg></div>
    <div class="status"><span class="dot"></span> En construcción</div>
    <h1>Vine a Terapia</h1>
    <p>Estamos preparando nuestro espacio principal de atención psicológica. Mientras tanto, ya puedes acceder a nuestra Biblioteca con más de 900 recursos clínicos.</p>
    <a class="btn" href="/recursos">Explorar Biblioteca de Recursos <span class="arr">→</span></a>
    <div class="foot">Consultas: <a href="mailto:vineaterapia@gmail.com">vineaterapia@gmail.com</a></div>
  </div>
</body>
</html>
